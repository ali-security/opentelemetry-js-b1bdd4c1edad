name: Unit Tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "24"
          - "25"
          - "26"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@11.0.0 drops support for Node.js v18
      # Install the latest npm compatible with this version of Node.js
      # - npm@11.1.0 supports: {"node":"^20.17.0 || >=22.9.0"}
      - run: npm install -g npm@"<11.0.0"
        if: ${{
          matrix.node_version == '18.19.0' ||
          matrix.node_version == '18' ||
          matrix.node_version == '20.6.0'
          }}
      # npm@12 requires {"node":"^22.22.2 || ^24.15.0 || >=26.0.0"}
      - run: npm install -g npm@"<12.0.0"
        if: ${{
          matrix.node_version == '20' ||
          matrix.node_version == '25'
          }}
      - run: npm install -g npm@latest
        if: ${{
          matrix.node_version == '22' ||
          matrix.node_version == '24' ||
          matrix.node_version == '26'
          }}

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - run: npm test 2>&1 | tee test-output.log
        shell: bash

      - name: Test results summary
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/seal-test-report.sh test-output.log

      - name: Pack instrumentation-http
        if: ${{ matrix.node_version == '24' }}
        run: |
          mkdir -p dist-out
          npm pack --ignore-scripts --workspace=experimental/packages/opentelemetry-instrumentation-http --pack-destination=dist-out
          mv dist-out/opentelemetry-instrumentation-http-0.219.0.tgz dist-out/instrumentation-http-0.219.0.tgz
      - name: Upload instrumentation-http tarball
        if: ${{ matrix.node_version == '24' }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-http-tgz
          path: dist-out/instrumentation-http-0.219.0.tgz
          if-no-files-found: error
  node-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '22'

      - run: npm install -g npm@latest

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        shell: bash
        run: npm run test 2>&1 | tee test-output.log

      - name: Test results summary
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/seal-test-report.sh test-output.log
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        shell: bash
        run: npm run test:browser 2>&1 | tee test-output.log

      - name: Test results summary
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/seal-test-report.sh test-output.log
  webworker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        shell: bash
        run: npm run test:webworker 2>&1 | tee test-output.log

      - name: Test results summary
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/seal-test-report.sh test-output.log
